name: build-kernel

on:
  workflow_dispatch:
    inputs:
      variants:
        description: "Which variants to build: a, b, or ab"
        required: false
        default: "b"

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        variant: [b]
    steps:
      - name: Check selection
        id: gate
        run: |
          want="${{ github.event.inputs.variants }}"
          case "$want" in
            ab|a-b) want="ab" ;;
            "") want="a" ;;
          esac
          v="${{ matrix.variant }}"
          if [ "$want" = "ab" ] || [ "$want" = "$v" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "skipping variant $v (requested: $want)"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'
        with:
          fetch-depth: 1

      - name: Free disk space
        if: steps.gate.outputs.run == 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /opt/hostedtoolcache/CodeQL || true
          sudo apt-get clean
          df -h /

      - name: Install build dependencies
        if: steps.gate.outputs.run == 'true'
        timeout-minutes: 15
        run: |
          set -euo pipefail
          APT="sudo env DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::ForceIPv4=true -o Acquire::Retries=5 -o Acquire::http::Timeout=60"
          $APT update
          $APT install -y --no-install-recommends \
            build-essential bc bison flex libssl-dev libelf-dev \
            python3 git zip unzip curl wget xz-utils lsb-release \
            binutils-aarch64-linux-gnu
          df -h /

      - name: Install clang
        if: steps.gate.outputs.run == 'true'
        timeout-minutes: 20
        run: |
          set -euo pipefail
          APT="sudo env DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::ForceIPv4=true -o Acquire::Retries=5 -o Acquire::http::Timeout=60"
          # prefer clang 21 (what upstream used); fall back to the runner's clang if
          # apt.llvm.org is unreachable, otherwise the build fails for the wrong reason
          if timeout 900 bash -c "curl -fsSL https://apt.llvm.org/llvm.sh -o llvm.sh && chmod +x llvm.sh && sudo ./llvm.sh 21"; then
            $APT install -y --no-install-recommends clang-21 lld-21 llvm-21
            CLANG_BIN=/usr/bin/clang-21
            LLVM_NM=/usr/bin/llvm-nm-21
          else
            echo "::warning::llvm.sh/clang-21 unavailable, falling back to distro clang"
            $APT install -y --no-install-recommends clang lld llvm
            CLANG_BIN=$(command -v clang)
            LLVM_NM=$(command -v llvm-nm || true)
          fi
          sudo update-alternatives --install /usr/bin/clang clang "$CLANG_BIN" 500
          [ -n "${LLVM_NM:-}" ] && sudo update-alternatives --install /usr/bin/llvm-nm llvm-nm "$LLVM_NM" 500 || true
          clang --version
          aarch64-linux-gnu-as --version | head -1

      - name: Build kernel (variant ${{ matrix.variant }})
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          chmod +x tb371fc/ci/build-kernel.sh
          ./tb371fc/ci/build-kernel.sh ${{ matrix.variant }} 2>&1 | tee build-${{ matrix.variant }}.log
          test -f arch/arm64/boot/Image

      - name: Repack boot image
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          chmod +x tb371fc/ci/repack.sh
          ./tb371fc/ci/repack.sh ${{ matrix.variant }} 2>&1 | tee repack-${{ matrix.variant }}.log
          test -f out/boot-tb371fc-ReSukiSU-${{ matrix.variant }}-permissive.img

      - name: Upload artifacts
        if: steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: kernel-variant-${{ matrix.variant }}
          retention-days: 30
          path: |
            out/boot-tb371fc-ReSukiSU-${{ matrix.variant }}-permissive.img
            arch/arm64/boot/Image
            build-${{ matrix.variant }}.log
            repack-${{ matrix.variant }}.log
